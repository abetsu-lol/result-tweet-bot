name: Deploy

# このワークフローを実行するリポジトリに設定された GCP プロジェクトにデプロイする。
# fork した場合は、自分のリポジトリに以下の変数を設定すれば自分のプロジェクトにデプロイできる（README 参照）。
#
# リポジトリの Variable:          DEPLOY_ENABLED（"true"）
# Environment "prod" の Variables: GCP_PROJECT_ID, GCP_REGION, TF_STATE_BUCKET, GCP_WORKLOAD_PROVIDER, GCP_SA_EMAIL

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # デプロイ用の設定がされていないリポジトリ（fork した直後など）ではスキップする。
    # ジョブの `if` では Environment の変数を参照できないため、リポジトリの Variable にする必要がある。
    if: vars.DEPLOY_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Authenticate to GCP using Workload Identity
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ vars.GCP_SA_EMAIL }}

    - name: Package Cloud Function
      run: ./scripts/package_function.sh

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

    - name: Terraform Init
      working-directory: terraform/environments/prod
      run: |
        terraform init -input=false \
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
          -backend-config="prefix=terraform/state"

    - name: Terraform Apply
      working-directory: terraform/environments/prod
      run: |
        terraform apply -auto-approve -input=false \
          -var="project=${{ vars.GCP_PROJECT_ID }}" \
          -var="region=${{ vars.GCP_REGION }}"
